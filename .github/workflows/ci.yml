name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Windows Node ${{ matrix.node-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Strict compliance guard: never sync official vendor assets or upload packaged binaries in CI.
      - name: Check repository compliance (no vendor assets or decoded scripts tracked)
        run: npm run check:compliance

      - name: Run clean-clone unit test suite
        run: npm test
